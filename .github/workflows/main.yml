name: Build PartialAnimationReplacer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout source (with CommonLibSSE-NG submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure (preset ALL = SE + AE + VR)
        shell: pwsh
        run: |
          cmake -S . --preset=ALL

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2

      - name: List output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/Release -Filter *.dll | Select-Object FullName, Length

      - name: Upload dll
        uses: actions/upload-artifact@v4
        with:
          name: PAR-dll
          path: |
            build/Release/*.dll
