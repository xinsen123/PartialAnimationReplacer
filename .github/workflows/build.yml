name: Build PartialAnimationReplacer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout source (with CommonLibSSE-NG submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure (Ninja + MSVC)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "STEP-CONFIGURE VS: $vsPath"
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_CXX_FLAGS="/EHsc /MP /W4" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_OVERLAY_PORTS="$PWD\cmake\ports" `
            -DSKSE_SUPPORT_XBYAK=ON `
            -DBUILD_SKYRIM=ON `
            -DENABLE_SKYRIM_SE=ON `
            -DENABLE_SKYRIM_AE=ON `
            -DENABLE_SKYRIM_VR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Patch clib-util editorID.hpp (encoding-safe A -> W)
        shell: pwsh
        run: |
          $found = $false
          Get-ChildItem -Path "$PWD\build\vcpkg_installed" -Recurse -Filter "editorID.hpp" | ForEach-Object {
            $found = $true
            $sr = New-Object System.IO.StreamReader($_.FullName, $true)
            $text = $sr.ReadToEnd()
            $enc = $sr.CurrentEncoding
            $sr.Close()
            $cnt = ([regex]::Matches($text, 'GetModuleHandleA')).Count
            if ($cnt -gt 0) {
              $new = $text.Replace('GetModuleHandleA', 'GetModuleHandleW')
              $sw = New-Object System.IO.StreamWriter($_.FullName, $false, $enc)
              $sw.Write($new)
              $sw.Close()
              Write-Host "STEP-PATCH ok: $($_.FullName) replaced $cnt (enc: $($enc.WebName))"
            } else {
              Write-Host "STEP-PATCH skip: $($_.FullName) no match (enc: $($enc.WebName))"
            }
          }
          if (-not $found) { Write-Host "STEP-PATCH WARNING: editorID.hpp not found!" }

      - name: Build Release
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64"
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: List output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Filter *.dll | Select-Object FullName, Length

      - name: Upload dll
        uses: actions/upload-artifact@v4
        with:
          name: PAR-dll
          path: |
            build/*.dll
